name: Deploy to Cloudflare Pages
on:
  push:
    paths:
      - "tests/**/*.rs"
      - "src/**/*.rs"
      - "Cargo.toml"
      - "Cargo.lock"
      - "docs/**"
      - ".github/workflows/cloudflare-pages.yml"

jobs:
  rust-docs-build:
    name: Build Rustdoc Pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: Build Rustdoc Pages
        run: cargo doc --no-deps
      - name: Upload rustdocs artifact
        uses: actions/upload-artifact@v7
        with:
          name: rust-docs
          path: target/doc

  hugo-docs-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    name: Build Hugo Pages
    steps:
      - uses: actions/checkout@v7
      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.124.1"
          extended: true
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: "docs/package-lock.json"
      - name: Run Hugo
        run: |
          cd docs
          npm ci
          hugo --minify
      - name: Upload docs/public artifact
        uses: actions/upload-artifact@v7
        with:
          name: hugo-docs
          path: docs/public

  deploy:
    name: Deploy to Cloudflare
    runs-on: ubuntu-latest
    environment:
      name: cloudflare-pages
      url: ${{ steps.deployment.outputs.pages-deployment-alias-url || steps.deployment.outputs.deployment-url }}
    needs:
      - rust-docs-build
      - hugo-docs-build
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Download docs artifact
        uses: actions/download-artifact@v8
        with:
          name: hugo-docs
          path: docs/public
      - name: Download rustdocs artifact
        uses: actions/download-artifact@v8
        with:
          name: rust-docs
          path: docs/public/rust
      - name: Publish to Cloudflare Pages
        id: deployment
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: docs
          command: pages deploy public --project-name=symcurve --commit-dirty=true
